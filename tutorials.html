<style>
  :root{
    --bg:#09060f; --panel:#110d1a; --panel2:#161022; --stroke:#271f38; --stroke2:#352c4c;
    --text:#f1e7fa; --muted:#8e8ca6; --blue2:#b096ff; --violet:#ff5cc8; --green:#54d696;
    --grad:linear-gradient(135deg,#7c5cff 0%,#ff5cc8 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:98px}
  body{overflow-x:clip;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--blue2);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{width:min(820px,92%);margin-inline:auto}

  /* aurora background, same as the main page */
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(100px);will-change:transform}
  .aurora i:nth-child(1){width:640px;height:640px;left:-160px;top:-180px;background:#6a3dff;opacity:.5;animation:drift1 26s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:560px;height:560px;right:-140px;top:4%;background:#ff3fb4;opacity:.28;animation:drift2 30s ease-in-out infinite alternate}
  .aurora i:nth-child(3){width:520px;height:520px;left:28%;top:52%;background:#2d6bff;opacity:.2;animation:drift3 34s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(180px,140px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-160px,200px) scale(.9)}}
  @keyframes drift3{to{transform:translate(120px,-160px) scale(1.2)}}

  /* glass nav pill */
  header{position:sticky;top:0;z-index:5;padding-top:12px}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;width:min(1120px,92%);margin-inline:auto;padding:0 18px;border:1px solid var(--stroke2);border-radius:20px;background:rgba(14,10,24,.66);backdrop-filter:blur(18px);box-shadow:0 18px 44px -22px rgba(0,0,0,.85)}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;color:var(--text)}
  .brand:hover{text-decoration:none}
  .brand img{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#2a1f52,#140f20);border:1px solid #473780;padding:5px}
  .back{font-size:.92rem;font-weight:600;padding:9px 16px;border-radius:11px;border:1px solid var(--stroke2);background:#1a1429;color:var(--text);transition:transform .15s,border-color .15s,background .15s}
  .back:hover{text-decoration:none;border-color:#52467a;background:#241b3a;transform:translateY(-1px)}

  h1{font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:-1.6px;line-height:1.1;margin:54px 0 10px;background:linear-gradient(90deg,#8d6bff,#ff5cc8,#8d6bff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;display:inline-block}
  @keyframes shine{to{background-position:200% center}}
  .upd{color:var(--muted);font-size:.9rem;margin-bottom:26px}
  .toc{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
  .toc a{padding:8px 16px;border-radius:99px;border:1px solid #2e2548;background:rgba(30,20,52,.7);font-size:.9rem;font-weight:600;transition:border-color .2s,transform .2s}
  .toc a:hover{text-decoration:none;border-color:#6a52b8;transform:translateY(-1px)}

  /* each part is a glass card */
  section{padding:30px 32px 18px;margin-top:26px;border:1px solid var(--stroke);border-radius:24px;background:linear-gradient(180deg,rgba(22,16,34,.82),rgba(17,13,26,.82));backdrop-filter:blur(6px);position:relative;overflow:hidden}
  section::before{content:"";position:absolute;left:28px;right:28px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}
  h2{font-size:1.6rem;letter-spacing:-.4px;margin-bottom:14px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  h3{font-size:1.06rem;margin:22px 0 6px}
  p,li{color:#b9b3d0;font-size:1rem}
  p{margin-bottom:12px}
  ul{margin:6px 0 14px 22px;display:grid;gap:6px}
  li::marker{color:var(--violet)}
  strong{color:#fff}
  .box{margin:18px 0;padding:16px 20px;border-radius:16px;border:1px solid #40335f;background:rgba(30,22,56,.55)}
  footer{margin:60px 0 50px;color:#6c6b85;font-size:.84rem;border-top:1px solid var(--stroke);padding-top:22px}

  .js .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .js .reveal.in{opacity:1;transform:none}
  @media (max-width:600px){section{padding:24px 20px 12px;border-radius:20px}}
  @media (prefers-reduced-motion:reduce){.aurora i,h1{animation:none!important}.js .reveal{opacity:1;transform:none}}

  /* tutorials */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;margin-top:10px}
  .tcard{border:1px solid var(--stroke);border-radius:22px;overflow:hidden;background:linear-gradient(180deg,rgba(22,16,34,.85),rgba(17,13,26,.85));box-shadow:0 30px 70px -40px rgba(0,0,0,.9)}
  .tstage{position:relative;aspect-ratio:16/9;background:radial-gradient(500px 260px at 30% 20%,#2a1a5c,#0a0710 70%);display:grid;place-items:center}
  .tstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tsoon{display:grid;gap:10px;place-items:center;text-align:center;color:#c9c2e2;font-weight:800;letter-spacing:3px;font-size:.8rem;text-transform:uppercase}
  .tsoon .pbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--grad);opacity:.55}
  .tsoon svg{width:26px;height:26px;fill:#fff;margin-left:3px}
  .tinfo{padding:18px 22px 22px}
  .tinfo .n{font-size:.75rem;font-weight:800;letter-spacing:2px;color:var(--blue2);text-transform:uppercase}
  .tinfo h3{font-size:1.12rem;margin:4px 0 4px;line-height:1.35}
  .tinfo p{color:#aaa6c2;font-size:.95rem;margin:0}
</style>
</head>
<body>

<script>
var SITE = window.SITE || {};
(function () {
  var grid = document.getElementById("t-grid");
  var list = Array.isArray(SITE.tutorials) ? SITE.tutorials : [];
  function ytId(url) {
    var m = /^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/i.exec(url);
    return m ? m[1] : "";
  }
  var cards = [];
  list.forEach(function (v) {
    if (!v) return;
    var id = typeof v.src === "string" ? ytId(v.src.trim()) : "";
    cards.push({ id: id, title: String(v.title || "Tutorial").slice(0, 100), text: String(v.text || "").slice(0, 160) });
  });
  while (cards.length < 2) cards.push({ id: "", title: "Tutorial " + (cards.length + 1), text: "Video coming soon." });
  cards.forEach(function (c, i) {
    var card = document.createElement("div"); card.className = "tcard reveal";
    var stage = document.createElement("div"); stage.className = "tstage";
    if (c.id) {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + c.id + "?rel=0";
      f.title = c.title; f.loading = "lazy"; f.allowFullscreen = true;
      f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      f.referrerPolicy = "strict-origin-when-cross-origin";
      stage.appendChild(f);
    } else {
      stage.innerHTML = '<div class="tsoon"><div class="pbtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>Coming soon</div>';
    }
    var info = document.createElement("div"); info.className = "tinfo";
    var n = document.createElement("div"); n.className = "n"; n.textContent = "Tutorial " + (i + 1);
    var h = document.createElement("h3"); h.textContent = c.title;
    info.appendChild(n); info.appendChild(h);
    if (c.text) { var p = document.createElement("p"); p.textContent = c.text; info.appendChild(p); }
    card.appendChild(stage); card.appendChild(info); grid.appendChild(card);
  });
})();
(function(){
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.06});
  els.forEach(function(e){io.observe(e)});
  setTimeout(function(){els.forEach(function(e){e.classList.add('in')})},2500);
})();
</script>
<script>
/* LED light that drives around the edge of the page (skipped for people who prefer reduced motion) */
(function(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("aria-hidden","true");
  svg.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;z-index:9999;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 5px #8d6bff) drop-shadow(0 0 12px #ff5cc8)";
  var layers=[{L:26,o:.16,c:"#7c5cff"},{L:17,o:.35,c:"#a35cff"},{L:9,o:.7,c:"#ff5cc8"},{L:3,o:1,c:"#ffffff"}],rects=[];
  layers.forEach(function(l){
    var r=document.createElementNS(NS,"rect");
    r.setAttribute("pathLength","100");r.setAttribute("fill","none");r.setAttribute("stroke",l.c);
    r.setAttribute("stroke-width","3");r.setAttribute("stroke-linecap","round");r.setAttribute("stroke-opacity",l.o);
    r.setAttribute("stroke-dasharray",l.L+" "+(100-l.L));r.setAttribute("rx","20");
    svg.appendChild(r);rects.push(r);
  });
  document.body.appendChild(svg);
  function size(){var w=document.documentElement.clientWidth,h=window.innerHeight;
    rects.forEach(function(r){r.setAttribute("x","2");r.setAttribute("y","2");r.setAttribute("width",Math.max(10,w-4));r.setAttribute("height",Math.max(10,h-4))})}
  size();addEventListener("resize",size);
  var head=0,last=performance.now(),LAP=10; /* seconds per lap */
  (function tick(t){head=(head+(t-last)/1000/LAP*100)%100;last=t;
    for(var i=0;i<rects.length;i++)rects[i].setAttribute("stroke-dashoffset",(layers[i].L-head).toFixed(2));
    requestAnimationFrame(tick)})(last);
})();
</script>
